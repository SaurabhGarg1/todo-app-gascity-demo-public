description = """
Ship one todo-app-2 requirement: implement it, test locally with Playwright,
publish to GitHub Pages, then test the live site.

```bash
gc sling todo-app-2/cursor <bead-id> --on mol-todo-ship
```

## MCP tools

- **eTools** — read the JIRA ticket when the requirement references one
- **Figma** — read the design when the requirement references one
- **Playwright** — available if needed for manual browser checks

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| convoy_id | runtime | Input convoy tracking the single requirement bead |
| worker | caller | Pool that runs every step (default `todo-app-2/cursor`) |
| base_branch | caller | Branch the worktree starts from (default `master`) |
| escalation_target | caller | Mail recipient when a step is blocked (default `human`) |
"""
formula = "mol-todo-ship"

[requires]
formula_compiler = ">=2.0.0"

[vars.worker]
description = "Pool that executes every step."
default = "todo-app-2/cursor"

[vars.base_branch]
description = "Branch the worktree is created from."
default = "master"

[vars.escalation_target]
description = "Mail recipient when work is blocked."
default = "human"

[[steps]]
id = "implement"
title = "Implement the requirement"
description = """
Build the requirement in a git worktree and commit. Do not push.

**1. Resolve the requirement:**

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-todo-ship requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
gc bd update "$WORK_BEAD_ID" --claim
```

Read the title and description. That is the requirement.

If it references a JIRA ticket, use the **eTools** MCP to read that ticket.
If it references a Figma design, use the **Figma** MCP to read that design.

**2. Reuse or create the worktree** on branch `ship/<bead-id>`:

```bash
RIG_ROOT=$(pwd)
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r 'if type == "array" then .[0] else . end | .metadata["gc.work_dir"] // .metadata.work_dir // empty')
BRANCH="ship/${WORK_BEAD_ID}"
if [ -z "$WORKTREE" ] || [ ! -d "$WORKTREE" ]; then
  git fetch --prune origin
  WORKTREE="${RIG_ROOT}/worktrees/${WORK_BEAD_ID}"
  if git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
    git worktree add "$WORKTREE" "$BRANCH"
  else
    git worktree add -b "$BRANCH" "$WORKTREE" "origin/{{base_branch}}"
  fi
fi
cd "$WORKTREE"
if [ "$(git rev-parse --abbrev-ref HEAD)" != "$BRANCH" ]; then
  git checkout "$BRANCH"
fi
ROOT_ID=$(gc bd show "$(gc hook current --id-only)" --json | jq -r 'if type == "array" then .[0] else . end | .metadata["gc.root_bead_id"] // empty')
gc bd update "$WORK_BEAD_ID" --set-metadata gc.work_dir="$WORKTREE" --set-metadata work_dir="$WORKTREE"
if [ -n "$ROOT_ID" ]; then
  gc bd update "$ROOT_ID" --set-metadata gc.work_dir="$WORKTREE" --set-metadata work_dir="$WORKTREE"
fi
```

**3. Implement the requirement.**

**4. Install and commit:**

```bash
[ -f scripts/check-env.sh ] && source scripts/check-env.sh
npm install
git add -A
git status --short
git commit -m "feat: <requirement summary>" || true
gc bd update "$(gc hook current --id-only)" --set-metadata gc.outcome=pass --status=closed --append-notes "Implemented in $WORKTREE."
```

If any command fails, stop and close this step as a hard failure:

```bash
gc mail send {{escalation_target}} -s "mol-todo-ship implement failed" -m "<command>: <error>"
gc bd update "$(gc hook current --id-only)" \
  --set-metadata gc.outcome=fail \
  --set-metadata gc.failure_class=hard \
  --set-metadata gc.failure_reason="<command>: <error>" \
  --status=closed \
  --append-notes "<command>: <error>"
```
"""
metadata = { "gc.run_target" = "{{worker}}" }

[[steps]]
id = "test-local"
title = "Run Playwright tests locally"
needs = ["implement"]
description = """
Add or update Playwright tests in `e2e/` if the requirement needs them.
Run the local Playwright suite. If tests fail, fix the product or tests and rerun until they pass.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r 'if type == "array" then .[0] else . end | .metadata["gc.work_dir"] // .metadata.work_dir // empty')
cd "$WORKTREE"
[ -f scripts/check-env.sh ] && source scripts/check-env.sh
npm run test:e2e
```

If you changed tests or code, commit:

```bash
git add -A
git diff --cached --quiet || git commit -m "test: update playwright tests"
gc bd update "$(gc hook current --id-only)" --set-metadata gc.outcome=pass --status=closed --append-notes "Local Playwright tests passed."
```

If `npm run test:e2e` keeps failing, stop:

```bash
gc mail send {{escalation_target}} -s "mol-todo-ship test-local failed" -m "<command>: <error>"
gc bd update "$(gc hook current --id-only)" \
  --set-metadata gc.outcome=fail \
  --set-metadata gc.failure_class=hard \
  --set-metadata gc.failure_reason="<command>: <error>" \
  --status=closed \
  --append-notes "<command>: <error>"
```
"""
metadata = { "gc.run_target" = "{{worker}}" }

[[steps]]
id = "publish"
title = "Push and deploy to GitHub Pages"
needs = ["test-local"]
description = """
Push the branch and deploy to GitHub Pages.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r 'if type == "array" then .[0] else . end | .metadata["gc.work_dir"] // .metadata.work_dir // empty')
cd "$WORKTREE"
[ -f scripts/check-env.sh ] && source scripts/check-env.sh
git push -u origin HEAD
npm run deploy
gc bd update "$(gc hook current --id-only)" --set-metadata gc.outcome=pass --status=closed --append-notes "Published to $(jq -r .homepage package.json)."
```

`npm run deploy` runs `predeploy` (`npm run build`) then pushes `dist/` to `gh-pages`.

If `git push` or `npm run deploy` fails, stop:

```bash
gc mail send {{escalation_target}} -s "mol-todo-ship publish failed" -m "<command>: <error>"
gc bd update "$(gc hook current --id-only)" \
  --set-metadata gc.outcome=fail \
  --set-metadata gc.failure_class=hard \
  --set-metadata gc.failure_reason="<command>: <error>" \
  --status=closed \
  --append-notes "<command>: <error>"
```
"""
metadata = { "gc.run_target" = "{{worker}}" }

[[steps]]
id = "test-live"
title = "Run Playwright tests on the deployed site"
needs = ["publish"]
description = """
Run Playwright against the live GitHub Pages URL. If tests fail, fix the product,
rerun local Playwright, commit, push, deploy, and test live again until they pass.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r 'if type == "array" then .[0] else . end | .metadata["gc.work_dir"] // .metadata.work_dir // empty')
cd "$WORKTREE"
[ -f scripts/check-env.sh ] && source scripts/check-env.sh
npm run test:e2e:live
```

On failure: read the Playwright output, fix the code, then:

```bash
[ -f scripts/check-env.sh ] && source scripts/check-env.sh
npm run test:e2e
git add -A && git diff --cached --quiet || git commit -m "fix: live deployment issues"
git push -u origin HEAD
npm run deploy
npm run test:e2e:live
```

When live tests pass, close the requirement and release the session:

```bash
COMMIT=$(git rev-parse HEAD)
BRANCH=$(git rev-parse --abbrev-ref HEAD)
URL=$(jq -r '.homepage' package.json)
gc bd update "$WORK_BEAD_ID" \
  --set-metadata gc.outcome=pass \
  --set-metadata gc.work_outcome=shipped \
  --set-metadata gc.work_commit="$COMMIT" \
  --set-metadata gc.work_branch="$BRANCH" \
  --status=closed \
  --append-notes "Shipped to ${URL}. Commit: ${COMMIT}."
gc bd update "$(gc hook current --id-only)" --set-metadata gc.outcome=pass --status=closed --notes "Requirement ${WORK_BEAD_ID} shipped."
gc runtime drain-ack
```

If live tests cannot be made to pass, stop:

```bash
gc mail send {{escalation_target}} -s "mol-todo-ship test-live failed" -m "<command>: <error>"
gc bd update "$(gc hook current --id-only)" \
  --set-metadata gc.outcome=fail \
  --set-metadata gc.failure_class=hard \
  --set-metadata gc.failure_reason="<command>: <error>" \
  --status=closed \
  --append-notes "<command>: <error>"
```
"""
metadata = { "gc.run_target" = "{{worker}}" }
